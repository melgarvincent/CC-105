    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbee's Bake Shop - Inventory System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #fff8f0;
    color: #4b2e20;
}

/* LOGIN */
#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #8b4513, #d2691e);
}

.login-box {
    width: 360px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
    text-align: center;
}

.logo {
    font-size: 55px;
}

.login-box h1 {
    margin-bottom: 8px;
}

.login-box p {
    color: #777;
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.login-box button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #8b4513;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.login-box button:hover {
    background: #6f350f;
}

#errorMessage {
    color: red;
    margin-top: 10px;
}

/* APP */
#app {
    display: none;
}

header {
    height: 70px;
    background: #8b4513;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

header h2 {
    font-size: 22px;
}

.logout {
    background: #fff;
    color: #8b4513;
    border: none;
    padding: 9px 16px;
    border-radius: 7px;
    cursor: pointer;
}

.container {
    padding: 25px;
}

/* NAV */
.nav {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.nav button {
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    background: #ead5c0;
    color: #4b2e20;
    cursor: pointer;
}

.nav button.active,
.nav button:hover {
    background: #8b4513;
    color: white;
}

/* SECTIONS */
.section {
    display: none;
}

.section.active {
    display: block;
}

/* DASHBOARD CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.card h3 {
    color: #777;
    font-size: 14px;
}

.card strong {
    display: block;
    font-size: 30px;
    margin-top: 8px;
}

/* TOOLBAR */
.toolbar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.search {
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 7px;
    min-width: 250px;
}

.primary {
    background: #8b4513;
    color: white;
    border: none;
    padding: 11px 17px;
    border-radius: 7px;
    cursor: pointer;
}

/* TABLE */
.table-box {
    background: white;
    border-radius: 12px;
    overflow-x: auto;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #f2e1d0;
}

.badge {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
}

.in-stock {
    background: #d8f5dc;
    color: #237a2c;
}

.low-stock {
    background: #fff0bd;
    color: #946800;
}

.out-stock {
    background: #ffd5d5;
    color: #a00000;
}

/* BUTTONS */
.action {
    border: none;
    padding: 6px 9px;
    border-radius: 5px;
    cursor: pointer;
    margin-right: 3px;
}

.edit {
    background: #e4efff;
    color: #2464a8;
}

.delete {
    background: #ffe0e0;
    color: #b00000;
}

/* FORM */
.form-box {
    background: white;
    max-width: 600px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 7px;
}

.form-buttons {
    display: flex;
    gap: 10px;
}

.cancel {
    padding: 11px 18px;
    border: none;
    background: #ddd;
    border-radius: 7px;
    cursor: pointer;
}

/* RESPONSIVE */
@media(max-width: 800px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 500px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">

    <div class="login-box">

        <div class="logo">🧁</div>

        <h1>Arbee's Bake Shop</h1>
        <p>Inventory Management System</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">Login</button>

        <div id="errorMessage"></div>

    </div>

</div>


<!-- MAIN APPLICATION -->
<div id="app">

<header>

    <h2>🧁 Arbee's Bake Shop</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <!-- NAVIGATION -->
    <div class="nav">

        <button
            class="active"
            onclick="showSection('dashboard', this)">
            📊 Dashboard
        </button>

        <button
            onclick="showSection('products', this)">
            🧁 Products
        </button>

        <button
            onclick="showSection('stock', this)">
            📦 Stock In/Out
        </button>

    </div>


    <!-- DASHBOARD -->
    <section id="dashboard" class="section active">

        <h1>Dashboard</h1>

        <br>

        <div class="cards">

            <div class="card">
                <h3>Total Products</h3>
                <strong id="totalProducts">0</strong>
            </div>

            <div class="card">
                <h3>Total Stock</h3>
                <strong id="totalStock">0</strong>
            </div>

            <div class="card">
                <h3>Low Stock</h3>
                <strong id="lowStock">0</strong>
            </div>

            <div class="card">
                <h3>Out of Stock</h3>
                <strong id="outStock">0</strong>
            </div>

        </div>

        <div class="table-box">

            <table>

                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="dashboardTable"></tbody>

            </table>

        </div>

    </section>


    <!-- PRODUCTS -->
    <section id="products" class="section">

        <h1>Product Management</h1>

        <br>

        <div class="toolbar">

            <input
                class="search"
                id="searchInput"
                placeholder="🔎 Search products..."
                onkeyup="displayProducts()"
            >

            <button
                class="primary"
                onclick="openProductForm()">
                + Add Product
            </button>

        </div>


        <!-- PRODUCT FORM -->

        <div
            id="productForm"
            class="form-box"
            style="display:none; margin-bottom:20px;">

            <h2 id="formTitle">Add Product</h2>

            <br>

            <div class="form-group">

                <label>Product Name</label>

                <input
                    id="productName"
                    type="text"
                    placeholder="Example: Chocolate Cake">

            </div>


            <div class="form-group">

                <label>Category</label>

                <select id="productCategory">

                    <option>Bread</option>
                    <option>Cake</option>
                    <option>Pastry</option>
                    <option>Cookies</option>
                    <option>Others</option>

                </select>

            </div>


            <div class="form-group">

                <label>Quantity</label>

                <input
                    id="productQuantity"
                    type="number"
                    min="0"
                    placeholder="0">

            </div>


            <div class="form-group">

                <label>Price (₱)</label>

                <input
                    id="productPrice"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="0.00">

            </div>


            <div class="form-buttons">

                <button
                    class="primary"
                    onclick="saveProduct()">
                    Save Product
                </button>

                <button
                    class="cancel"
                    onclick="closeProductForm()">
                    Cancel
                </button>

            </div>

        </div>


        <!-- PRODUCT TABLE -->

        <div class="table-box">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="productTable"></tbody>

            </table>

        </div>

    </section>


    <!-- STOCK -->
    <section id="stock" class="section">

        <h1>Stock In / Stock Out</h1>

        <br>

        <div class="form-box">

            <div class="form-group">

                <label>Product</label>

                <select id="stockProduct"></select>

            </div>


            <div class="form-group">

                <label>Transaction Type</label>

                <select id="stockType">

                    <option value="in">
                        Stock In
                    </option>

                    <option value="out">
                        Stock Out
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Quantity</label>

                <input
                    type="number"
                    id="stockQuantity"
                    min="1"
                    placeholder="Enter quantity">

            </div>


            <button
                class="primary"
                onclick="processStock()">
                Save Transaction
            </button>

        </div>

    </section>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let products = JSON.parse(
    localStorage.getItem("arbeeProducts")
) || [

    {
        id: 1,
        name: "Pandesal",
        category: "Bread",
        quantity: 100,
        price: 3
    },

    {
        id: 2,
        name: "Chocolate Cake",
        category: "Cake",
        quantity: 8,
        price: 450
    },

    {
        id: 3,
        name: "Cheese Bread",
        category: "Bread",
        quantity: 12,
        price: 15
    },

    {
        id: 4,
        name: "Cookies",
        category: "Cookies",
        quantity: 35,
        price: 10
    },

    {
        id: 5,
        name: "Ube Cake",
        category: "Cake",
        quantity: 4,
        price: 500
    }

];

let editId = null;


/* =========================
   LOGIN
========================= */

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (
        username === "admin" &&
        password === "admin123"
    ) {

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("app")
            .style.display = "block";

        updateDashboard();
        displayProducts();
        updateStockSelect();

    } else {

        document.getElementById("errorMessage")
            .textContent =
            "Incorrect username or password.";

    }

}


/* =========================
   LOGOUT
========================= */

function logout() {

    document.getElementById("app")
        .style.display = "none";

    document.getElementById("loginPage")
        .style.display = "flex";

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

}


/* =========================
   NAVIGATION
========================= */

function showSection(sectionId, button) {

    document
        .querySelectorAll(".section")
        .forEach(section => {
            section.classList.remove("active");
        });

    document
        .getElementById(sectionId)
        .classList.add("active");

    document
        .querySelectorAll(".nav button")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");

    if (sectionId === "stock") {
        updateStockSelect();
    }

}


/* =========================
   SAVE DATA
========================= */

function saveData() {

    localStorage.setItem(
        "arbeeProducts",
        JSON.stringify(products)
    );

}


/* =========================
   STATUS
========================= */

function getStatus(quantity) {

    if (quantity === 0) {

        return `
            <span class="badge out-stock">
                Out of Stock
            </span>
        `;

    }

    if (quantity <= 10) {

        return `
            <span class="badge low-stock">
                Low Stock
            </span>
        `;

    }

    return `
        <span class="badge in-stock">
            In Stock
        </span>
    `;

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard() {

    const totalProducts =
        products.length;

    const totalStock =
        products.reduce(
            (sum, product) =>
            sum + Number(product.quantity),
            0
        );

    const lowStock =
        products.filter(
            product =>
            product.quantity > 0 &&
            product.quantity <= 10
        ).length;

    const outStock =
        products.filter(
            product =>
            product.quantity === 0
        ).length;


    document.getElementById("totalProducts")
        .textContent = totalProducts;

    document.getElementById("totalStock")
        .textContent = totalStock;

    document.getElementById("lowStock")
        .textContent = lowStock;

    document.getElementById("outStock")
        .textContent = outStock;


    const table =
        document.getElementById("dashboardTable");

    table.innerHTML = "";


    products.forEach(product => {

        table.innerHTML += `

            <tr>

                <td>${product.name}</td>

                <td>${product.category}</td>

                <td>${product.quantity}</td>

                <td>
                    ${getStatus(product.quantity)}
                </td>

            </tr>

        `;

    });

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts() {

    const table =
        document.getElementById("productTable");

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    table.innerHTML = "";


    const filtered =
        products.filter(product =>
            product.name
            .toLowerCase()
            .includes(search)
        );


    filtered.forEach(product => {

        table.innerHTML += `

            <tr>

                <td>${product.id}</td>

                <td>${product.name}</td>

                <td>${product.category}</td>

                <td>${product.quantity}</td>

                <td>
                    ₱${Number(product.price).toFixed(2)}
                </td>

                <td>
                    ${getStatus(product.quantity)}
                </td>

                <td>

                    <button
                        class="action edit"
                        onclick="editProduct(${product.id})">
                        Edit
                    </button>

                    <button
                        class="action delete"
                        onclick="deleteProduct(${product.id})">
                        Delete
                    </button>

                </td>

            </tr>

        `;

    });

}


/* =========================
   ADD PRODUCT
========================= */

function openProductForm() {

    editId = null;

    document.getElementById("formTitle")
        .textContent = "Add Product";

    document.getElementById("productName")
        .value = "";

    document.getElementById("productQuantity")
        .value = "";

    document.getElementById("productPrice")
        .value = "";

    document.getElementById("productForm")
        .style.display = "block";

}


/* =========================
   CLOSE FORM
========================= */

function closeProductForm() {

    document.getElementById("productForm")
        .style.display = "none";

}


/* =========================
   SAVE PRODUCT
========================= */

function saveProduct() {

    const name =
        document.getElementById("productName")
        .value.trim();

    const category =
        document.getElementById("productCategory")
        .value;

    const quantity =
        Number(
            document.getElementById("productQuantity")
            .value
        );

    const price =
        Number(
            document.getElementById("productPrice")
            .value
        );


    if (
        name === "" ||
        quantity < 0 ||
        price < 0
    ) {

        alert("Please complete all fields correctly.");

        return;

    }


    if (editId === null) {

        const newProduct = {

            id:
                products.length > 0
                ? Math.max(...products.map(p => p.id)) + 1
                : 1,

            name,
            category,
            quantity,
            price

        };

        products.push(newProduct);

    } else {

        const product =
            products.find(
                p => p.id === editId
            );

        product.name = name;
        product.category = category;
        product.quantity = quantity;
        product.price = price;

    }


    saveData();

    displayProducts();
    updateDashboard();
    updateStockSelect();

    closeProductForm();

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;

    editId = id;

    document.getElementById("formTitle")
        .textContent = "Edit Product";

    document.getElementById("productName")
        .value = product.name;

    document.getElementById("productCategory")
        .value = product.category;

    document.getElementById("productQuantity")
        .value = product.quantity;

    document.getElementById("productPrice")
        .value = product.price;

    document.getElementById("productForm")
        .style.display = "block";

}


/* =========================
   DELETE PRODUCT
========================= */

function deleteProduct(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    if (
        confirm(
            `Delete ${product.name}?`
        )
    ) {

        products =
            products.filter(
                p => p.id !== id
            );

        saveData();

        displayProducts();
        updateDashboard();
        updateStockSelect();

    }

}


/* =========================
   STOCK SELECT
========================= */

function updateStockSelect() {

    const select =
        document.getElementById("stockProduct");

    select.innerHTML = "";


    products.forEach(product => {

        select.innerHTML += `

            <option value="${product.id}">
                ${product.name}
                (Stock: ${product.quantity})
            </option>

        `;

    });

}


/* =========================
   STOCK IN / OUT
========================= */

function processStock() {

    const productId =
        Number(
            document.getElementById("stockProduct")
            .value
        );

    const type =
        document.getElementById("stockType")
        .value;

    const quantity =
        Number(
            document.getElementById("stockQuantity")
            .value
        );


    if (!quantity || quantity <= 0) {

        alert("Enter a valid quantity.");

        return;

    }


    const product =
        products.find(
            p => p.id === productId
        );


    if (!product) {

        alert("Product not found.");

        return;

    }


    if (type === "in") {

        product.quantity += quantity;

        alert(
            `${quantity} ${product.name} added to stock.`
        );

    } else {

        if (quantity > product.quantity) {

            alert(
                "Not enough stock available."
            );

            return;

        }

        product.quantity -= quantity;

        alert(
            `${quantity} ${product.name} removed from stock.`
        );

    }


    document.getElementById("stockQuantity")
        .value = "";


    saveData();

    updateDashboard();
    displayProducts();
    updateStockSelect();

}

</script>

</body>
</html>
